name: Python tests and security regression checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[api,dev]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q agents pqc_wireguard tests cli.py simulator.py enrichment.py
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run browser evaluator unit tests
        run: node --test tests/test_web.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/evaluator.mjs
      - name: Build distribution
        run: python -m build
