[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "post-quantum-vpn-wireguard-engine"
version = "2.0.0"
description = "PQC-WireGuard: Hybrid Post-Quantum Tunneling & Key Negotiation Supervisor"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
post-quantum-vpn-wireguard-engine = "pqc_wireguard.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/post-quantum-vpn-wireguard-engine"
Repository = "https://github.com/abusuraihsakhri/post-quantum-vpn-wireguard-engine.git"
