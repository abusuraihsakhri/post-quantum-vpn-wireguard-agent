[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "post-quantum-vpn-wireguard-agent"
version = "2.1.0"
description = "Local rules-based WireGuard/PQC concept assessment prototype (not a VPN)"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
post-quantum-vpn-wireguard-agent = "cli:main"
post-quantum-vpn-wireguard-engine = "pqc_wireguard.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/post-quantum-vpn-wireguard-agent"
Repository = "https://github.com/abusuraihsakhri/post-quantum-vpn-wireguard-agent"

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator"]

[tool.setuptools.packages.find]
include = ["agents*", "pqc_wireguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
